<?xml version="1.0" encoding="UTF-8"?>
<svg width="128" height="128" viewBox="0 0 128 128" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8b7bff"/>
      <stop offset="1" stop-color="#5b2be0"/>
    </linearGradient>
    <linearGradient id="mic" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#e9e4ff"/>
    </linearGradient>
  </defs>

  <!-- squircle background -->
  <rect x="10" y="10" width="108" height="108" rx="27" fill="url(#bg)"/>
  <!-- subtle top highlight -->
  <rect x="10" y="10" width="108" height="54" rx="27" fill="#ffffff" opacity="0.08"/>

  <!-- microphone capsule -->
  <rect x="50" y="26" width="28" height="46" rx="14" fill="url(#mic)"/>

  <!-- cradle (U), stem and base -->
  <g fill="none" stroke="#ffffff" stroke-width="6" stroke-linecap="round">
    <path d="M42 58 a22 22 0 0 0 44 0"/>
    <path d="M64 80 v12"/>
    <path d="M50 98 h28"/>
  </g>

  <!-- voice accents -->
  <g fill="none" stroke="#ffffff" stroke-width="5" stroke-linecap="round" opacity="0.85">
    <path d="M34 44 a16 16 0 0 0 0 20"/>
    <path d="M94 44 a16 16 0 0 1 0 20"/>
  </g>
</svg>
